<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore satellites and other objects orbiting Earth in real time on an interactive 3D globe, on Meta Quest, mobile or web."
    />
    <title>SatViz</title>
    <!-- Starts the satellite data download before any JavaScript runs. getSatellites() in
         src/api/satellites.ts reuses this response, so its fetch must stay a plain same-origin
         GET with no custom headers, which is what crossorigin="anonymous" matches. -->
    <link
      rel="preload"
      href="/v2/satellites"
      as="fetch"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Downloads the OMM catalog from Spacebook once and uploads the /v2/satellites payload to R2, where
# the Pages Function serves it. This is the only thing that calls Spacebook, so the number of
# requests doesn't depend on the site's traffic. See backend/publish.py.
name: Publish satellites

on:
  schedule:
    # Every 12 hours. GitHub delays the most scheduled runs at the start of the hour.
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual run waits for a scheduled one instead of overlapping it.
concurrency:
  group: publish-satellites

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-publish.txt
      - run: pip install -r requirements-publish.txt
      - run: python -m publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: satviz-data

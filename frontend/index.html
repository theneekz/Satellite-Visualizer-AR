<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS uses this icon for Add to Home Screen, and iMessage can fall back to it. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Pinch zoom belongs to the globe, not the page. maximum-scale also stops Safari from
         zooming in when a text field gains focus. iOS ignores user-scalable=no, so main.tsx
         blocks the pinch there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Explore satellites and other objects orbiting Earth in real time on an interactive 3D globe, on Meta Quest, mobile or web."
    />
    <title>SatViz: Real-time 3D satellite tracker for web, AR, and VR</title>
    <!-- The same site also answers on satellite-visualizer-ar.pages.dev. The canonical URL tells
         search engines to rank this domain and treat the other as a copy. -->
    <link rel="canonical" href="https://satviz.nikosward.com/" />
    <!-- Link previews in iOS Messages, LinkedIn, WhatsApp, Slack, and others. Their crawlers
         don't run JavaScript, so these tags must stay in this static file. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SatViz" />
    <meta property="og:title" content="SatViz: Real-time 3D satellite tracker" />
    <meta
      property="og:description"
      content="Explore satellites and other objects orbiting Earth in real time on an interactive 3D globe, on Meta Quest, mobile or web."
    />
    <meta property="og:url" content="https://satviz.nikosward.com/" />
    <!-- Preview crawlers need an absolute image URL. WhatsApp may skip images over ~300 KB. -->
    <meta property="og:image" content="https://satviz.nikosward.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A 3D globe of North America surrounded by thousands of yellow satellite dots"
    />
    <!-- iMessage plays this muted clip inline. Apps that don't support video show og:image. -->
    <meta property="og:video" content="https://satviz.nikosward.com/og-video.mp4" />
    <meta property="og:video:secure_url" content="https://satviz.nikosward.com/og-video.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tells search engines this page is a free web app, which can show in search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SatViz",
        "url": "https://satviz.nikosward.com/",
        "description": "Explore satellites and other objects orbiting Earth in real time on an interactive 3D globe, on Meta Quest, mobile or web.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires WebGL. AR and VR need a WebXR browser.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Niko Sward", "url": "https://nikosward.com/" }
      }
    </script>
    <!-- The navigation's fonts. swap shows fallback text at once instead of waiting on them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Oxanium:wght@500;600&display=swap"
    />
    <!-- Starts the satellite data download before any JavaScript runs. getSatellites() in
         src/api/satellites.ts reuses this response, so its fetch must stay a plain same-origin
         GET with no custom headers, which is what crossorigin="anonymous" matches. -->
    <link
      rel="preload"
      href="/v2/satellites"
      as="fetch"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

syntax = "proto3";

// Static display info for one OMM record.
message OMM {
  uint32 id = 1;              // NORAD_CAT_ID
  string name = 2;            // OBJECT_NAME
  string designator = 3;      // OBJECT_ID
  int64 epoch_ms = 4;         // EPOCH as UTC unix milliseconds
  double period_min = 5;
  double inclination_deg = 6;
  double eccentricity = 7;
  double perigee_km = 8;
  double apogee_km = 9;
  double mean_motion = 10;    // rev/day
  double raan_deg = 11;       // RA_OF_ASC_NODE
  double arg_perigee_deg = 12;  // ARG_OF_PERICENTER
  double mean_anomaly_deg = 13;
  double bstar = 14;
  uint32 rev_at_epoch = 15;

  // Was the OBJECT_TYPE string, replaced by the object_type enum (field 19).
  reserved 16;
  reserved "object_type_legacy";
  // Was the RCS string, replaced by the rcs enum (field 20).
  reserved 17;
  reserved "rcs_legacy";
  // Optional: not present in every OMM source.
  optional string originator = 18;
  // OBJECT_TYPE_UNSPECIFIED when the type is UNKNOWN or the source doesn't
  // say. The value doubles as the frontend's per-type color index, so keep the
  // numbers stable.
  ObjectType object_type = 19;
  // RCS_SIZE_UNSPECIFIED when the source doesn't give a size.
  RcsSize rcs = 20;
}

// OMM OBJECT_TYPE. The frontend uses each value as an index into its type
// color palette.
enum ObjectType {
  // Covers both OMM's UNKNOWN and a missing OBJECT_TYPE: SatViz treats them
  // the same.
  OBJECT_TYPE_UNSPECIFIED = 0;
  OBJECT_TYPE_PAYLOAD = 1;
  OBJECT_TYPE_ROCKET_BODY = 2;
  OBJECT_TYPE_DEBRIS = 3;
}

// OMM RCS: how big the object looks to radar, as a radar cross-section
// bucket. Small is under 0.1 square meters, medium is 0.1 to 1, and large is
// over 1.
enum RcsSize {
  RCS_SIZE_UNSPECIFIED = 0;
  RCS_SIZE_SMALL = 1;
  RCS_SIZE_MEDIUM = 2;
  RCS_SIZE_LARGE = 3;
}

message OMMList {
  repeated OMM satellites = 1;
}
